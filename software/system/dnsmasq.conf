# DHCP + DNS for devices connected to STOMPBOX-CTRL.
# Every name resolves to the Pi, so a phone's "is there internet?" check lands
# on the settings page and the phone opens it automatically (captive portal).
interface=uap0
bind-interfaces
except-interface=lo
no-resolv
no-hosts
dhcp-range=192.168.4.10,192.168.4.60,255.255.255.0,12h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
# RFC 8910 captive-portal URL (newer Android / iOS read this from DHCP)
dhcp-option=114,"http://192.168.4.1/"
address=/#/192.168.4.1
