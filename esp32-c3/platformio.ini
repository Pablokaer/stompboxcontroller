; STOMPBOX Controller – ESP32-C3 firmware
; Build:  pio run            Flash over USB:  pio run -t upload
; Serial console:  pio device monitor

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
    bblanchon/ArduinoJson@7.2.1
extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/merge_bin.py
