; STOMPBOX Controller – ESP32-C3 firmware
; Build:  pio run            Flash over USB:  pio run -t upload
; Serial console:  pio device monitor

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
    bblanchon/ArduinoJson@7.2.1
extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/merge_bin.py

; Unit tests on the computer (no board):  pio test -e native
; Runs the real settings.cpp + engine.cpp with Arduino stand-ins from test/stubs.
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<settings.cpp> +<engine.cpp>
build_flags =
    -std=gnu++17
    -pthread
    -Iinclude
    -Itest/stubs
    -DARDUINO=100
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
lib_deps =
    bblanchon/ArduinoJson@7.2.1
extra_scripts =
